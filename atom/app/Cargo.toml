[package]
name = "atom"
version = "0.3.2"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
arc-swap = "1.9.5"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
axum = "0.8.9"
getrandom = "0.4.3"
hex = "0.4.3"
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service"] }
mime_guess = "2.0.5"
parking_lot = "0.12.5"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rust-embed = "8.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tower-service = "0.3.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webpki-roots = "1.0.12"
x509-parser = "0.18.1"
